<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#115e59" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0f766e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="240" fill="url(#bgGrad)"/>

  <!-- Fluid Cyber Waves -->
  <path d="M 0 160 C 200 130, 380 200, 560 170 C 740 140, 880 180, 1000 150 L 1000 240 L 0 240 Z" fill="url(#wave1Grad)"/>
  <path d="M 0 185 C 240 155, 420 220, 620 185 C 800 150, 900 195, 1000 175 L 1000 240 L 0 240 Z" fill="url(#wave2Grad)"/>

  <!-- Cyber Terminal / Forensic Shield Icon -->
  <g transform="translate(500, 60)" text-anchor="middle" filter="url(#cyberGlow)">
    <!-- Terminal Outer Frame -->
    <rect x="-22" y="-18" width="44" height="32" rx="4" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.8"/>
    <!-- Terminal Title Line -->
    <line x1="-22" y1="-8" x2="22" y2="-8" stroke="#115e59" stroke-width="1"/>
    <!-- Window Dots -->
    <circle cx="-16" cy="-13" r="1.5" fill="#f43f5e"/>
    <circle cx="-11" cy="-13" r="1.5" fill="#facc15"/>
    <circle cx="-6" cy="-13" r="1.5" fill="#4ade80"/>
    <!-- Command Prompt '>' and cursor -->
    <path d="M -15 -2 L -9 2 L -15 6" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-5" y1="5" x2="3" y2="5" stroke="#22d3ee" stroke-width="1.8"/>
  </g>

  <!-- Main Title -->
  <text x="500" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">
    THENUDA SAHAS
  </text>

  <!-- Subtitle -->
  <text x="500" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#ccfbf1" letter-spacing="0.5">
    Cybersecurity Researcher • DFIR Analyst • Academic Portfolio
  </text>
</svg>
